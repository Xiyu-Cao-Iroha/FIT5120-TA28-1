# Serves CalmPath at https://ying-iroha.online/calmpath/, proxying
# /calmpath/api/ through to the FastAPI container on 127.0.0.1:8010.
# Copy to /etc/nginx/sites-available/calmpath, symlink into
# sites-enabled, then run `certbot --nginx -d ying-iroha.online` to add
# HTTPS (certbot rewrites the listen/server_name blocks below itself).
server {
    listen 80;
    listen [::]:80;
    server_name ying-iroha.online;

    location /calmpath/api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /calmpath/ {
        alias /var/www/calmpath/dist/;
        try_files $uri $uri/ /calmpath/index.html;
    }
}
