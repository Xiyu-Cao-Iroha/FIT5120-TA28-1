services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: calmpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: calmpath
    volumes:
      - calmpath_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calmpath -d calmpath"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../services/api/.env
    ports:
      - "127.0.0.1:8010:8010"

volumes:
  calmpath_db_data:
